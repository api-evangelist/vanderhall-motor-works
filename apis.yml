aid: vanderhall-motor-works
name: Vanderhall Motor Works
description: >-
  Vanderhall Motor Works is a privately held American vehicle manufacturer founded in 2010 by Steve
  Hall and headquartered in Provo, Utah. The company hand-builds three-wheeled autocycles — the
  Laguna, Venice, Venice Speedster, Carmel and Santarosa — alongside the all-electric Edison and the
  quad-motor Brawley off-road UTV, selling through an independent dealer network rather than direct
  to consumers. Its software footprint is internal rather than commercial: Vanderhall runs a dealer
  portal, an admin portal and a parts/accessory shop on its own domain, and the admin portal
  publishes an OAuth-protected Model Context Protocol (MCP) endpoint at
  https://portal.vanderhallusa.com/mcp with RFC 8414 authorization-server metadata, RFC 9728
  protected-resource metadata and RFC 7591 dynamic client registration. There is no public developer
  program, no published OpenAPI, and no public API reference.

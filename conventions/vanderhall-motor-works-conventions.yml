dry_run_mode:
  supported: unknown
  grade: unknown
  detail: >-
    Cannot be established without the tool list. Not marked `na` — this endpoint is an ADMIN portal
    surface and therefore very likely to carry write operations, so claiming "no write surface" would
    be a guess in the provider's favour.
reversibility:
  grade: unknown
  applies: unknown
  operations: []
  detail: >-
    Unresolvable from outside. The MCP tool list, which is where any cancel/void/refund/restore
    operation and its window would be visible, returns -32001 "Unauthorized: missing bearer token"
    to anonymous callers, and Vanderhall publishes no documentation that states a reversal window for
    any operation. No window is asserted here — inventing one is the single error in this pipeline
    that could cost a user real money. This is recorded as `unknown`, not `na`: an admin portal is a
    write surface by nature, so the honest reading is "not disclosed", not "does not apply".
  what_would_resolve_it: >-
    An authenticated tools/list against https://portal.vanderhallusa.com/mcp, or any published MCP
    tool reference from Vanderhall.

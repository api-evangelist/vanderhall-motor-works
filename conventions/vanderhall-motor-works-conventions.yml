method: probed
source: >-
  Live probes of the Vanderhall Admin Portal MCP endpoint and its OAuth discovery documents,
  2026-09-02. Vanderhall publishes no developer documentation, so nothing here is quoted from a docs
  page and nothing has been assumed from convention.
auth:
  style: oauth2-bearer
  detail: >-
    Authorization code + PKCE (S256) against https://portal.vanderhallusa.com, single scope `mcp`,
    public clients (token_endpoint_auth_methods = ["none"]), dynamic client registration available.
  cross_ref: authentication/vanderhall-motor-works-authentication.yml
transport:
  protocol: JSON-RPC 2.0 over HTTPS POST
  endpoint: https://portal.vanderhallusa.com/mcp
  accept: application/json, text/event-stream
  session: >-
    The host sets a PHPSESSID cookie (HttpOnly, Max-Age 7200) on every request; it is not required for
    the JSON-RPC call to be accepted and appears to be the surrounding PHP application's, not MCP's.
idempotency:
  supported: unknown
  header: null
  detail: >-
    Not determinable. No idempotency key header is documented and the tool set — which is where any
    write operations would live — is behind OAuth. No `Idempotency` pointer is emitted, because
    asserting one would credit Vanderhall with a guarantee it has never published.
pagination:
  style: unknown
  detail: No public operation surface to observe pagination on.
versioning:
  scheme: unknown
  detail: >-
    No version segment in the endpoint path (/mcp, not /v1/mcp), no version header observed, and no
    published versioning policy. MCP protocol version negotiation happens inside `initialize`, which
    is auth-gated.
error_envelope:
  shape: JSON-RPC 2.0 error object
  critical_note: >-
    Auth failures are returned with HTTP 200 and no WWW-Authenticate header. Status-code-only error
    handling will read an unauthorized response as a success.
  cross_ref: errors/vanderhall-motor-works-problem-types.yml

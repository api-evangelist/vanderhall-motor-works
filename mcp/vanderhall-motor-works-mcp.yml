tools_note: >-
  The live tool set is NOT publicly discoverable and has NOT been guessed. An unauthenticated
  POST of {"jsonrpc":"2.0","id":1,"method":"tools/list"} to https://portal.vanderhallusa.com/mcp
  returns HTTP 200 with {"jsonrpc":"2.0","id":1,"error":{"code":-32001,"message":"Unauthorized:
  missing bearer token"}}; the same is true of `initialize` and of a bare GET. Vanderhall publishes
  no OpenAPI, no llms.txt and no MCP documentation, so there is no second source to name tools from.
  Recovering the tool list and its inputSchemas requires an authenticated introspection with a token
  carrying the `mcp` scope, which in turn requires an account on the Vanderhall Admin Portal.
